<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — ExpenseMate Personal Finance Manager</title>
  <meta name="description" content="Sign in to ExpenseMate to manage your personal finances, track spending, and reach your financial goals.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --brand-dark: #2B3A52;
      --brand-mid: #4A607A;
      --brand-slate: #8FA3C0;
      --accent: #E8B4A8;
      --accent-dark: #D49B8E;
      --bg: #F7F4F0;
      --surface: #FFFFFF;
      --border: #E2DAD1;
      --text: #2B3445;
      --muted: #718096;
      --radius: 14px;
    }

    body {
      font-family: 'Outfit', system-ui, sans-serif;
      background: var(--bg);
      min-height: 100vh;
      display: flex;
      -webkit-font-smoothing: antialiased;
    }

    /* ─── Left Branding Panel ─── */
    .auth-panel-left {
      width: 42%;
      background: linear-gradient(145deg, var(--brand-dark) 0%, var(--brand-mid) 60%, #5D7A99 100%);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: flex-start;
      padding: 60px 56px;
      position: relative;
      overflow: hidden;
    }

    .auth-panel-left::before {
      content: '';
      position: absolute;
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, rgba(143,163,192,0.2) 0%, transparent 70%);
      top: -150px;
      right: -150px;
      border-radius: 50%;
      pointer-events: none;
    }

    .auth-panel-left::after {
      content: '';
      position: absolute;
      width: 300px;
      height: 300px;
      background: radial-gradient(circle, rgba(232,180,168,0.15) 0%, transparent 70%);
      bottom: -80px;
      left: -60px;
      border-radius: 50%;
      pointer-events: none;
    }

    .brand-logo-wrap {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 48px;
    }

    .brand-logo-icon {
      width: 48px;
      height: 48px;
      background: rgba(255,255,255,0.15);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(8px);
    }

    .brand-name {
      font-size: 1.5rem;
      font-weight: 800;
      color: #FFFFFF;
      letter-spacing: 1px;
    }

    .brand-tagline {
      font-size: 0.75rem;
      color: rgba(255,255,255,0.6);
      letter-spacing: 1.5px;
      text-transform: uppercase;
      font-weight: 500;
    }

    .auth-headline {
      font-size: 2.6rem;
      font-weight: 800;
      color: #FFFFFF;
      line-height: 1.15;
      margin-bottom: 16px;
      letter-spacing: -0.5px;
    }

    .auth-headline span {
      color: var(--accent);
    }

    .auth-subline {
      font-size: 1rem;
      color: rgba(255,255,255,0.65);
      line-height: 1.6;
      max-width: 340px;
      margin-bottom: 48px;
    }

    .feature-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .feature-item {
      display: flex;
      align-items: center;
      gap: 12px;
      color: rgba(255,255,255,0.85);
      font-size: 0.92rem;
      font-weight: 500;
    }

    .feature-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent);
      flex-shrink: 0;
    }

    /* ─── Right Form Panel ─── */
    .auth-panel-right {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 48px 40px;
      background: var(--surface);
    }

    .auth-form-box {
      width: 100%;
      max-width: 400px;
    }

    .auth-form-title {
      font-size: 1.75rem;
      font-weight: 800;
      color: var(--text);
      margin-bottom: 6px;
      letter-spacing: -0.3px;
    }

    .auth-form-sub {
      font-size: 0.9rem;
      color: var(--muted);
      margin-bottom: 32px;
    }

    .demo-info-box {
      background: linear-gradient(135deg, #EBF4FF 0%, #F0EAF8 100%);
      border: 1px solid #C3DAFE;
      border-radius: 10px;
      padding: 14px 18px;
      margin-bottom: 28px;
      font-size: 0.83rem;
      color: #2C5282;
      line-height: 1.6;
    }

    .demo-info-box strong {
      display: block;
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      font-weight: 700;
      margin-bottom: 6px;
      color: #2A4A7F;
    }

    .demo-info-box code {
      background: rgba(44,82,130,0.12);
      padding: 1px 6px;
      border-radius: 4px;
      font-family: 'Courier New', monospace;
      font-size: 0.82rem;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-label {
      display: block;
      font-size: 0.78rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.7px;
      color: var(--muted);
      margin-bottom: 8px;
    }

    .form-input {
      width: 100%;
      padding: 13px 16px;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      font-family: inherit;
      font-size: 0.95rem;
      color: var(--text);
      background: #FDFCFB;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .form-input:focus {
      border-color: var(--brand-slate);
      box-shadow: 0 0 0 3px rgba(143,163,192,0.2);
      background: #FFFFFF;
    }

    .btn-submit {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, var(--brand-mid) 0%, var(--brand-dark) 100%);
      color: #FFFFFF;
      border: none;
      border-radius: 10px;
      font-family: inherit;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
      letter-spacing: 0.3px;
      margin-top: 8px;
      box-shadow: 0 4px 14px rgba(74,96,122,0.35);
    }

    .btn-submit:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(74,96,122,0.45);
    }

    .btn-submit:active {
      transform: translateY(0);
    }

    .auth-divider {
      text-align: center;
      margin: 24px 0 0;
      font-size: 0.88rem;
      color: var(--muted);
    }

    .auth-divider a {
      color: var(--brand-mid);
      font-weight: 700;
      text-decoration: none;
    }

    .auth-divider a:hover {
      text-decoration: underline;
    }

    #toast-container {
      position: fixed;
      bottom: 24px;
      right: 24px;
      z-index: 1000;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .toast {
      padding: 14px 18px;
      border-radius: 10px;
      background: #FFFFFF;
      box-shadow: 0 8px 24px rgba(43,52,69,0.12);
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 0.9rem;
      font-weight: 500;
      border-left: 4px solid var(--brand-slate);
      animation: slideIn 0.3s ease;
      max-width: 360px;
      font-family: 'Outfit', sans-serif;
    }

    .toast.success { border-left-color: #38A169; }
    .toast.danger { border-left-color: #E53E3E; }

    @keyframes slideIn {
      from { transform: translateX(100%); opacity: 0; }
      to { transform: translateX(0); opacity: 1; }
    }

    @media (max-width: 768px) {
      .auth-panel-left { display: none; }
      .auth-panel-right { padding: 40px 24px; }
    }
  </style>
</head>
<body>
  <!-- Left Branding Panel -->
  <div class="auth-panel-left">
    <div class="brand-logo-wrap">
      <div class="brand-logo-icon">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.2">
          <rect x="2" y="5" width="20" height="14" rx="3"></rect>
          <line x1="2" y1="10" x2="22" y2="10"></line>
        </svg>
      </div>
      <div>
        <div class="brand-name">EXPENSEMATE</div>
        <div class="brand-tagline">Personal Finance Manager</div>
      </div>
    </div>

    <h1 class="auth-headline">Take Control of<br>Your <span>Finances</span></h1>
  </div>

  <!-- Right Form Panel -->
  <div class="auth-panel-right">
    <div class="auth-form-box">
      <h2 class="auth-form-title">Welcome back</h2>
      <p class="auth-form-sub">Sign in to your ExpenseMate account</p>

      <form id="login-form">
        <div class="form-group">
          <label class="form-label" for="login-email">Email Address</label>
          <input type="email" id="login-email" class="form-input" placeholder="name@example.com" required autocomplete="email">
        </div>

        <div class="form-group">
          <label class="form-label" for="login-password">Password</label>
          <input type="password" id="login-password" class="form-input" placeholder="••••••••" required autocomplete="current-password">
        </div>

        <button type="submit" class="btn-submit" id="login-submit-btn">Sign In to ExpenseMate</button>
      </form>

      <p class="auth-divider">Don't have an account? <a href="/register">Create one free</a></p>
    </div>
  </div>

  <div id="toast-container"></div>
  <script src="{{ url_for('static', filename='js/api.js') }}"></script>
  <script src="{{ url_for('static', filename='js/auth.js') }}"></script>
</body>
</html>
